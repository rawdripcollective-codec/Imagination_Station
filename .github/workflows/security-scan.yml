name: Scheduled Security Scan

on:
  schedule:
    # Run at 12:00 AM UTC daily
    - cron: "0 0 * * *"
    # Run at 12:00 PM UTC daily
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Validate environment variables
        run: |
          echo "Checking required environment variable definitions..."
          grep -v "^#" .env.example | grep "=" | awk -F= '{print $1}' | while read var; do
            echo "  Defined: $var"
          done

      - name: Build verification
        run: npm run build
        env:
          NODE_ENV: production
